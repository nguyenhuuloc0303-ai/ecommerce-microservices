name: Microservices CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Run Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start All 10 Containers
        run: |
          docker compose up -d --build
          echo "Waiting for all containers to initialize..."
          sleep 15
          for i in {1..30}; do
            STARTING=$(docker ps --filter "health_status=starting" -q)
            if [ -z "$STARTING" ]; then
              echo "All containers reached healthy state!"
              break
            fi
            echo "Waiting for services to finish healthchecks ($i/30)..."
            sleep 3
          done
          docker ps

      - name: Run CI Test Suite (Unit + E2E 25 TCs)
        run: node scripts/ci.js

      - name: Shutdown Containers
        if: always()
        run: docker compose down -v
