name: Microservices CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  ci-check:
    name: Microservices Architecture & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Microservices Code Syntax
        run: |
          node -c scripts/ci.js
          node -c scripts/seed.js
          node -c gateway/src/app.js
          node -c services/auth/src/app.js
          node -c services/customer-service/src/app.js
          node -c services/product-service/src/app.js
          node -c services/order-service/src/app.js
          node -c services/shipment-service/src/app.js
          echo "All 6 Microservices and scripts passed syntax validation!"

      - name: Validate Docker Compose 10-Container Topology
        run: |
          docker compose config --quiet
          echo "Docker Compose topology for 10 containers verified successfully!"
