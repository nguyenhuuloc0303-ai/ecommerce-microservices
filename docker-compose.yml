networks:
  ecom-net:
    driver: bridge

volumes:
  pg_data:
  mongo_data:
  redis_data:
  kafka_data:

services:
  # 1. PostgreSQL (Logical DBs: auth_db, customer_db, order_db)
  postgres:
    ports:
      - "5432:5432"
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer_pass}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MongoDB (Logical DBs: product_db, shipment_db)
  mongo:
    ports:
      - "27017:27017"
    build:
      context: ./docker/mongo
      dockerfile: Dockerfile
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin_secret}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-admin}
      PRODUCT_DB_USER: ${PRODUCT_DB_USER:-product_user}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:-product_pass}
      SHIPMENT_DB_USER: ${SHIPMENT_DB_USER:-shipment_user}
      SHIPMENT_DB_PASSWORD: ${SHIPMENT_DB_PASSWORD:-shipment_pass}
    volumes:
      - mongo_data:/data/db
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redis
  redis:
    ports:
      - "6379:6379"
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Apache Kafka
  kafka:
    ports:
      - "9092:9092"
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 5. Product Service
  product-service:
    ports:
      - "3003:3003"
      - "50053:50053"
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: 3003
      GRPC_PORT: 50053
      MONGO_URI: mongodb://product_user:product_pass@mongo:27017/product_db?authSource=product_db
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5

  # 6. Auth Service
  auth-service:
    ports:
      - "3001:3001"
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL_AUTH: postgresql://auth_user:auth_pass@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-for-microservices-2026}
      KAFKA_BROKER: kafka:9092
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      SHIPMENT_STAFF_USERNAME: ${SHIPMENT_STAFF_USERNAME:-shipment_staff}
      SHIPMENT_STAFF_PASSWORD: ${SHIPMENT_STAFF_PASSWORD:-Staff@123}
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5

  # 7. Customer Service (Customer & Membership + gRPC 50052)
  customer-service:
    ports:
      - "3002:3002"
      - "50052:50052"
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: customer-service
    restart: unless-stopped
    environment:
      PORT: 3002
      GRPC_PORT: 50052
      DATABASE_URL_CUSTOMER: postgresql://customer_user:customer_pass@postgres:5432/customer_db
      KAFKA_BROKER: kafka:9092
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5

  # 8. Order Service (Order & OrderDetail + Transactional Outbox)
  order-service:
    ports:
      - "3004:3004"
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: 3004
      DATABASE_URL_ORDER: postgresql://order_user:order_pass@postgres:5432/order_db
      CUSTOMER_GRPC_URL: customer-service:50052
      PRODUCT_GRPC_URL: product-service:50053
      KAFKA_BROKER: kafka:9092
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5

  # 9. Shipment Service (Shipment & Tracking + Kafka Consumer)
  shipment-service:
    ports:
      - "3005:3005"
    build:
      context: .
      dockerfile: services/shipment-service/Dockerfile
    container_name: shipment-service
    restart: unless-stopped
    environment:
      PORT: 3005
      MONGO_URI: mongodb://shipment_user:shipment_pass@mongo:27017/shipment_db?authSource=shipment_db
      KAFKA_BROKER: kafka:9092
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5

  # 10. API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-for-microservices-2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:3001
      CUSTOMER_SERVICE_URL: http://customer-service:3002
      PRODUCT_SERVICE_URL: http://product-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      SHIPMENT_SERVICE_URL: http://shipment-service:3005
      NODE_ENV: development
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - ecom-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5
